config_version = 14

[accessibility]
ui_scale = 0.90000000596046448

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    center = [ "clock", "temp" ]
    compositor_blur = false
    end = [ "notifications", "widget", "network", "bluetooth", "volume", "battery", "control-center", "github", "widget_2" ]
    font_weight = 400
    radius = 80
    shadow = false
    start = [ "workspaces", "active_window" ]
    thickness = 21

[control_center]
hidden_tabs = [ "monitor", "weather", "screen-time" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "noctalia/wallhaven:shortcut"

    [[control_center.shortcuts]]
    type = "vn1k/cursor:shortcut"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.0
cross_axis_padding = 0
enabled = true
icon_size = 29
item_spacing = 0
magnification = false
magnification_scale = 1.850000012665987
main_axis_padding = 0
margin_edge = 4
position = "left"
radius = 80
shadow = false
show_dots = true

[location]
address = "Sarapul,Russia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.4999999888241291
position = "bottom_left"

[osd]
background_opacity = 0.4999999888241291

[plugin_settings."blackbartblues/keymap"]
compositor = "hyprland"

[plugin_settings."h-jangra/keyviz"]
max_keys = 8

[plugins]
enabled = [
    "noctalia/wallhaven",
    "h-jangra/keyviz",
    "vn1k/cursor",
    "yuuto/arch-updater",
    "cleboost/ssh-launcher",
    "shangshui0302/github-kanban",
    "tadomika_ari/config-swap"
]

[shell]
app_icon_colorize = true
avatar_path = "/home/witty/.face.jpg"
panel_anchor_bar = "default"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 1.1500000171363354

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "en"
    "Russia (RU)" = "ru"

    [shell.launcher]
    app_grid = true
    compact = true
    show_app_actions = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    floating_layer = "top"
    floating_offset = 9
    launcher_position = "auto"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    confirm_region = true

    [shell.window_switcher]
    style = "compact"

[theme]
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "btop", "hyprland", "kitty", "qt" ]
    enable_community_templates = false

[wallpaper]
fill_color = "primary"
fill_mode = "stretch"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/witty/Pictures/wallhaven-x1llxz.png"

    [wallpaper.last]
    path = "/home/witty/Pictures/wallhaven-x1llxz.png"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

    [wallpaper.monitors.eDP-1]
    path = "/home/witty/Pictures/wallhaven-x1llxz.png"

[widget.control-center]
custom_image_colorize = true
glyph = "weather-moon-stars"

[widget.github]
type = "shangshui0302/github-kanban:github"

[widget.temp]
show_glyph = false
visualization = "none"

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.widget_2]
type = "tadomika_ari/config-swap:widget"

[widget.workspaces]
pill_scale = 0.59999999999999998
show_all_outputs = true